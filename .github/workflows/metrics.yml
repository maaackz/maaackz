name: Generate README Metrics

on:
  schedule:
    - cron: "0 8 * * *" # 16:00 Manila (GitHub cron is UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/metrics.yml

permissions:
  contents: write

concurrency:
  group: readme-metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      # Cache generated SVGs in the repository rather than depending on a
      # public image API every time someone views the profile.
      # Exclude large commit/contribution totals from the stats card.
      - name: Generate stats (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=maaackz&hide=commits,contribs&show_icons=true&hide_rank=true&theme=light_github&card_width=420
          path: metrics.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          fail_on_error: true

      - name: Generate stats (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=maaackz&hide=commits,contribs&show_icons=true&hide_rank=true&theme=dark_github&card_width=420
          path: metrics.dark.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          fail_on_error: true

      # Weight both file size and repository count so a single large
      # project doesn't dominate the top languages card.
      - name: Generate languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=maaackz&layout=compact&langs_count=8&size_weight=0.5&count_weight=0.5&hide=html,css&theme=light_github&card_width=420
          path: metrics.langs.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          fail_on_error: true

      - name: Generate languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=maaackz&layout=compact&langs_count=8&size_weight=0.5&count_weight=0.5&hide=html,css&theme=dark_github&card_width=420
          path: metrics.langs.dark.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          fail_on_error: true

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.svg metrics.dark.svg metrics.langs.svg metrics.langs.dark.svg
          if git diff --cached --quiet; then
            echo "No card changes to commit"
          else
            git commit -m "chore: refresh README metrics"
            git push
          fi
