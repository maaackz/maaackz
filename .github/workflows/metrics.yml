name: Generate README Metrics

on:
  schedule:
    - cron: "0 8 * * *" # 16:00 Manila (GitHub cron is UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/metrics.yml

permissions:
  contents: write

concurrency:
  group: readme-metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      # Cache generated SVGs in the repository rather than depending on a
      # public image API every time someone views the profile.
      # Exclude large commit/contribution totals from the stats card.
      - name: Generate stats (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=maaackz&hide=commits,contribs&show_icons=true&hide_rank=true&theme=light_github&card_width=420
          path: metrics.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          fail_on_error: true

      - name: Generate stats (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=maaackz&hide=commits,contribs&show_icons=true&hide_rank=true&theme=dark_github&card_width=420
          path: metrics.dark.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          fail_on_error: true

      # Weight both file size and repository count so a single large
      # project doesn't dominate the top languages card.
      - name: Generate languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=maaackz&layout=compact&langs_count=8&size_weight=0.5&count_weight=0.5&hide=html,css&theme=light_github&card_width=420
          path: metrics.langs.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          fail_on_error: true

      - name: Generate languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=maaackz&layout=compact&langs_count=8&size_weight=0.5&count_weight=0.5&hide=html,css&theme=dark_github&card_width=420
          path: metrics.langs.dark.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          fail_on_error: true

      - name: Commit updated cards (retry on concurrent pushes)
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Save generated files outside the checkout before updating from main.
          # This runner is ephemeral; resetting it cannot change remote history.
          cards=(metrics.svg metrics.dark.svg metrics.langs.svg metrics.langs.dark.svg)
          output_dir="$RUNNER_TEMP/generated-readme-metrics"
          mkdir -p "$output_dir"
          cp "${cards[@]}" "$output_dir/"

          for attempt in 1 2 3 4 5; do
            # Always base the new card commit on the latest main, preserving
            # other people's changes without force-pushing or a rebase conflict.
            git fetch origin main
            git reset --hard origin/main
            cp "$output_dir/"*.svg ./
            git add -- "${cards[@]}"

            if git diff --cached --quiet; then
              echo "Cards are already up to date"
              exit 0
            fi

            git commit -m "chore: refresh README metrics"
            if git push origin HEAD:main; then
              echo "README metrics pushed successfully"
              exit 0
            fi

            echo "main changed during push (attempt $attempt/5); retrying"
            sleep "$((attempt * 2))"
          done

          echo "::error::Could not push generated metrics after 5 attempts"
          exit 1
